name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: "Validate gitconfig"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check .gitconfig syntax
        run: git config --file .gitconfig --list

  secret-scan:
    name: "Scan for secrets"
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
